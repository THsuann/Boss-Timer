<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Timer</title>


<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, "Microsoft JhengHei", sans-serif;
  background: linear-gradient(135deg, #dbeafe, #93c5fd);
  color: #1e3a8a;
}

.app {
  padding: 16px;
  max-width: 760px;
  margin: auto;
}

.header {
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 24px;
}

.logo {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 2px;
}

.main-layout {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  justify-content: center;
}

.grid {
  display: grid;
  gap: 16px;
  width: 320px;
}

.card {
  background: #f8fbff;
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 3px 10px rgba(30, 64, 175, 0.18);
}

.card-title {
  font-size: 20px;
  font-weight: bold;
}

.time {
  text-align: center;
  font-size: 56px;
  font-weight: 900;
  margin: 22px 0 14px;
  color: #1e3a8a;
}

.time span {
  font-size: 22px;
}

.bar {
  height: 9px;
  background: #dbeafe;
  border-radius: 20px;
  overflow: hidden;
}

.progress {
  height: 100%;
  width: 100%;
  border-radius: 20px;
}

.monster {
  background: #3b82f6;
}

.black {
  background: #1d4ed8;
}

.btn {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 15px;
  margin-top: 14px;
  font-size: 18px;
  font-weight: bold;
  color: white;
  background: linear-gradient(135deg, #3b82f6, #2563eb);
  box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
}

.panel {
  width: 320px;
  background: #eff6ff;
  border: 2px dashed #93c5fd;
  border-radius: 18px;
  padding: 18px;
}

.panel h2 {
  margin-top: 0;
  font-size: 24px;
}

.row {
  margin-bottom: 14px;
}

label {
  font-weight: bold;
}

input {
  width: 100%;
  margin-top: 8px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #bfdbfe;
  font-size: 18px;
  color: #1e3a8a;
  background: #f8fbff;
}

.note {
  text-align: center;
  font-weight: bold;
  line-height: 1.8;
  margin-top: 18px;
  font-size: 17px;
}

.alert {
  color: #ef4444;
  font-size: 20px;
  text-align: center;
  font-weight: bold;
  min-height: 30px;
  margin-top: 10px;
}

.reset-btn {
  display: block;
  width: 300px;
  margin: 20px auto 0;
}

.danger {
  color: #ef4444 !important;
  animation: flash 1s infinite;
}

.danger-bar {
  background: #ef4444 !important;
}

@keyframes flash {
  0% { opacity: 1; }
  50% { opacity: 0.35; }
  100% { opacity: 1; }
}

@media (max-width: 720px) {
  .app {
    max-width: 430px;
  }

  .main-layout {
    flex-direction: column;
    align-items: center;
  }

  .grid,
  .panel {
    width: 100%;
  }

  .reset-btn {
    width: 100%;
  }
}
</style>

</head>


<body>
<div class="app">

  <div class="header">
    <div class="logo">BOSS TIMER</div>
  </div>

  <div class="main-layout">

    <div class="grid">

      <div class="card">
        <div class="card-title">👻 小怪生成</div>

        <div class="time" id="monsterTime">50.0<span>s</span></div>
        <div class="bar">
          <div class="progress monster" id="monsterBar"></div>
        </div>

        <button class="btn" onclick="startTimer('monster')">小怪生成重置</button>
      </div>

      <div class="card">
        <div class="card-title">💧 黑水</div>

        <div class="time" id="blackTime">70.0<span>s</span></div>
        <div class="bar">
          <div class="progress black" id="blackBar"></div>
        </div>

        <button class="btn" onclick="startTimer('black')">黑水出現重置</button>
      </div>

    </div>

    <div class="panel">
      <h2>⚙️ 秒數設定</h2>

      <div class="row">
        <label>小怪生成秒數</label>
        <input type="number" id="monsterSetting" value="50">
      </div>

      <div class="row">
        <label>黑水出現秒數</label>
        <input type="number" id="blackSetting" value="70">
      </div>

      <button class="btn" onclick="saveSettings()">💾 完成設定</button>

      <div class="note">
        89%　10秒 - 20分<br>
        84%　10秒 - 30分<br>
        69%　10秒 - 40分<br>
        49%　10秒 - 50分<br>
        19%　10秒 - 60分
      </div>
    </div>

  </div>

  <button class="btn reset-btn" onclick="resetAll()">↻ RESET ALL</button>

  <div class="alert" id="alertText"></div>

</div>



<script>
let timers = {
  monster: {
    name: "小怪生成",
    duration: 50,
    remaining: 50,
    interval: null,
    timeEl: document.getElementById("monsterTime"),
    barEl: document.getElementById("monsterBar")
  },
  black: {
    name: "黑水出現",
    duration: 70,
    remaining: 70,
    interval: null,
    timeEl: document.getElementById("blackTime"),
    barEl: document.getElementById("blackBar")
  }
};

function startTimer(type) {
  clearInterval(timers[type].interval);

  timers[type].remaining = timers[type].duration;
  updateDisplay(type);

  document.getElementById("alertText").textContent = "";

  timers[type].interval = setInterval(() => {
    timers[type].remaining -= 0.1;

    if (timers[type].remaining <= 0) {
      timers[type].remaining = 0;
      clearInterval(timers[type].interval);
      notify(timers[type].name + " 到了！");
    }

    updateDisplay(type);
  }, 100);
}

function updateDisplay(type) {
  const t = timers[type];

  t.timeEl.innerHTML = t.remaining.toFixed(1) + "<span>s</span>";

  let percent = (t.remaining / t.duration) * 100;
  t.barEl.style.width = percent + "%";

  if (t.remaining <= 10) {
    t.timeEl.classList.add("danger");
    t.barEl.classList.add("danger-bar");
  } else {
    t.timeEl.classList.remove("danger");
    t.barEl.classList.remove("danger-bar");
  }
}

function resetAll() {
  startTimer("monster");
  startTimer("black");
}

function saveSettings() {
  timers.monster.duration = Number(document.getElementById("monsterSetting").value);
  timers.black.duration = Number(document.getElementById("blackSetting").value);

  timers.monster.remaining = timers.monster.duration;
  timers.black.remaining = timers.black.duration;

  updateDisplay("monster");
  updateDisplay("black");

  notify("設定完成！");
}

function notify(message) {
  document.getElementById("alertText").textContent = message;

  if (navigator.vibrate) {
    navigator.vibrate([300, 150, 300]);
  }
}

updateDisplay("monster");
updateDisplay("black");
</script>


</body>
</html>
